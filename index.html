<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>amiba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0; padding: 0; width: 100%; height: 100vh;
  overflow: hidden; position: relative; background: #0A0A0D;
}
#root { width: 100%; height: 100%; }
/* ── pf1-shared.css ── */
/* ── PF1 shared tokens (iOS 26 liquid glass, 深濃藍) ── */
:root{
  --bg:#0C0C0F;
  --bg-2:#141418;
  --card:rgba(255,255,255,.05);
  --card-2:rgba(255,255,255,.08);
  --glass:rgba(20,22,28,.55);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --fg:rgba(255,255,255,.96);
  --fg-2:rgba(255,255,255,.72);
  --fg-3:rgba(255,255,255,.48);
  --fg-4:rgba(255,255,255,.28);
  --acc:#3B82F6;
  --acc-2:#8B5CF6;
  --acc-3:rgba(59,130,246,.18);
  --acc-glow:rgba(59,130,246,.35);
  --inc:#34D882;
  --exp:#FF5F57;
  --gld:#FFD060;
  --font-zh:'Noto Sans TC','PingFang TC',system-ui,sans-serif;
  --font-en:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
.pf1-screen{
  width:100%;height:100%;
  background:#0A0A0D;
  color:var(--fg);
  font-family:var(--font-en),var(--font-zh);
  position:relative;
  overflow:hidden;
}
.pf1-screen *{font-variant-numeric:tabular-nums;}
/* shared ambient */
.pf1-amb{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.pf1-amb::before,.pf1-amb::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);}
.pf1-amb::before{width:340px;height:340px;top:-120px;left:-100px;background:radial-gradient(circle,var(--acc) 0%,transparent 70%);opacity:.28;}
.pf1-amb::after{width:280px;height:280px;top:240px;right:-120px;background:radial-gradient(circle,var(--acc-2) 0%,transparent 70%);opacity:.24;}

/* floating header */
.pf1-fhdr{
  position:absolute;top:calc(env(safe-area-inset-top,47px) + 10px);
  left:14px;right:14px;z-index:10;
  height:52px;
  background:rgba(20,22,28,.58);
  backdrop-filter:blur(28px) saturate(1.6);
  -webkit-backdrop-filter:blur(28px) saturate(1.6);
  border:.5px solid var(--border-strong);
  border-radius:20px;
  display:flex;align-items:center;padding:0 8px 0 16px;
  box-shadow:0 2px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);
}
.pf1-fhdr-ttl{font-family:var(--font-zh);font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;}
.pf1-fhdr-btn{
  width:36px;height:36px;border-radius:12px;
  background:rgba(255,255,255,.08);border:.5px solid var(--border-strong);
  display:grid;place-items:center;color:var(--fg);font-size:15px;cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.pf1-fhdr-btn:active{transform:scale(.9);}

/* floating tab bar */
.pf1-tabbar{
  position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0) + 12px);
  z-index:10;
  height:62px;
  background:rgba(20,22,28,.68);
  backdrop-filter:blur(30px) saturate(1.6);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:.5px solid var(--border-strong);
  border-radius:22px;
  display:flex;align-items:center;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
}
.pf1-tab{
  flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:16px;color:var(--fg-3);cursor:pointer;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.pf1-tab.active{background:var(--acc-3);color:var(--acc);}
.pf1-tab-i{font-size:17px;}
.pf1-tab-l{font-family:var(--font-zh);font-size:10px;font-weight:500;}

.pf1-body{
  position:absolute;inset:0;z-index:5;
  padding:0 0 110px;
  overflow-y:auto;scrollbar-width:none;
}
.pf1-body::-webkit-scrollbar{display:none;}

/* common chip */
.pf1-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.08);border:.5px solid var(--border);
  font-family:var(--font-zh);font-size:11px;font-weight:500;color:var(--fg-2);
}
.pf1-chip.up{color:var(--inc);background:rgba(52,216,130,.14);border-color:rgba(52,216,130,.24);}
.pf1-chip.down{color:var(--exp);background:rgba(255,95,87,.14);border-color:rgba(255,95,87,.24);}
/* 移除數字輸入框的上下箭頭 */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance:textfield; }
</style>
<script>
// ── 全域帳本同步 ─────────────────────────────────────────────────
// 所有 PF 頁面共用此 index，切換帳本時廣播 'pf-ledger-change' 事件
window.__pfLedger = parseInt(localStorage.getItem('pf_cur_ledger') || '0');
window.pfSetLedger = function(idx) {
  if (window.__pfLedger === idx) return;
  window.__pfLedger = idx;
  localStorage.setItem('pf_cur_ledger', String(idx));
  window.dispatchEvent(new CustomEvent('pf-ledger-change', { detail: idx }));
};
// ── 共用 Hook：各 PF 頁面用來同步「目前帳本 index」，取代各自重複的
//    useState + useEffect 監聽 pf-ledger-change 那段樣板程式碼 ────────
function usePfLedgerIndex() {
  var state = React.useState(function () { return window.__pfLedger || 0; });
  var ledger = state[0], setLedger = state[1];
  React.useEffect(function () {
    function h(e) { setLedger(e.detail); }
    window.addEventListener('pf-ledger-change', h);
    return function () { window.removeEventListener('pf-ledger-change', h); };
  }, []);
  return [ledger, setLedger];
}
// ── 共用 Hook：讀取 pf_ledgers 清單（含 localStorage 後備邏輯）────────
function usePfLedgersList(defaults) {
  var state = React.useState(function () {
    try {
      var s = JSON.parse(localStorage.getItem('pf_ledgers') || 'null');
      return (s && s.length) ? s : defaults;
    } catch (e) {
      return defaults;
    }
  });
  return state[0];
}
// ── 共用：卡片玻璃毛玻璃樣式（多個 PF 頁面共用同一份視覺樣式）──────────
var PF_CARD_STYLE = {
  background: 'var(--card)',
  backdropFilter: 'blur(14px)',
  WebkitBackdropFilter: 'blur(14px)',
  border: '.5px solid var(--border)'
};
// ─────────────────────────────────────────────────────────────────
</script>

<script>
/* PF5 借貸頁 — 比照 PF1-PF4 iOS 26 液態玻璃風格 */
function PF5Final() {
  const [ldgOpen, setLdgOpen] = React.useState(false);
  const [ledger, setLedger] = usePfLedgerIndex();
  const [tab, setTab] = React.useState(0); // 0=借入 1=借出

  const fmtNT = n => (n < 0 ? "-" : "") + "NT$" + Math.abs(Math.round(n)).toLocaleString();
  const card = PF_CARD_STYLE;

  // ── 攤還試算（等額還款）──────────────────────────────────────
  const calcAmortization = d => {
    const r = d.rate / 100 / 12; // 月利率
    let bal = d.balance;
    const schedule = [];
    const now = new Date();
    let period = 0;
    while (bal > 0.5 && period < 600) {
      period++;
      const interest = r > 0 ? bal * r : 0;
      const payment = d.monthly > 0 ? d.monthly : bal + interest;
      const principal = Math.min(payment - interest, bal);
      bal = Math.max(0, bal - principal);
      const pDate = new Date(now.getFullYear(), now.getMonth() + period - 1, 1);
      schedule.push({
        period,
        date: `${pDate.getFullYear()}/${String(pDate.getMonth() + 1).padStart(2, '0')}`,
        payment: Math.round(principal + interest),
        principal: Math.round(principal),
        interest: Math.round(interest),
        balance: Math.round(bal)
      });
    }
    return schedule;
  };

  // ── 借入類型 ──────────────────────────────────────────────
  const DEBT_TYPES = ["銀行貸款", "個人借貸"];
  // 銀行貸款 → 預設納入淨資產計算；個人借貸 → 預設不納入
  const defaultInclude = type => type === "銀行貸款";

  // ── 預設範例資料 ─────────────────────────────────────────
  const defaultIn = [{
    id: "di-1",
    name: "房貸",
    lender: "台新銀行",
    type: "銀行貸款",
    total: 8000000,
    balance: 6500000,
    monthly: 28000,
    rate: 1.68,
    startDate: "2020-06",
    endDate: "2040-06",
    notes: "",
    includeInTotal: true
  }, {
    id: "di-2",
    name: "車貸",
    lender: "遠東銀行",
    type: "銀行貸款",
    total: 800000,
    balance: 520000,
    monthly: 12500,
    rate: 3.2,
    startDate: "2022-03",
    endDate: "2027-02",
    notes: "",
    includeInTotal: true
  }];
  const defaultOut = [{
    id: "do-1",
    name: "借給小明",
    borrower: "小明",
    amount: 50000,
    due: "2026-07-15",
    status: "未還",
    returnDate: "",
    notes: ""
  }, {
    id: "do-2",
    name: "借給小華",
    borrower: "小華",
    amount: 30000,
    due: "2026-06-01",
    status: "已還",
    returnDate: "2026-05-20",
    notes: "已確認歸還"
  }];

  // ── localStorage ─────────────────────────────────────────
  const [debtsIn, setDebtsIn] = React.useState(() => {
    try {
      const s = JSON.parse(localStorage.getItem('pf_debts_in') || 'null');
      return s && s.length ? s : defaultIn;
    } catch {
      return defaultIn;
    }
  });
  const [debtsOut, setDebtsOut] = React.useState(() => {

  // ── 封存（已售出 / 贈送）render

            C('div',{style:{flex:1,minWidth:0}},
              C('div',{style:{fontFamily:'var(--font-zh)',fontSize:15,fontWeight:600,color:'var(--fg)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},a.name),

    setInsEditMode(false);
  };
  const deleteIns = () => { saveAssets(assets.filter(a=>a.id!==detailIns.id)); setDetailIns(null); };
  const addPremiumReminder = () => {
    try {

        C('div',{onClick:()=>{setDetailIns(null);setInsEditMode(false);},style:{width:36,height:36,borderRadius:18,background:'rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,flexShrink:0}},'←'),

      ),
      // ── 分頁 tabs
      detailIns!=='new' && C('div',{style:{display:'flex',padding:'12px 16px 0',gap:8,flexShrink:0}},
        ['概況','保障內容','文件'].map((t,i)=>C('div',{key:i,onClick:()=>setInsTab(i),style:{padding:'8px 20px',borderRadius:20,fontFamily:'var(--font-zh)',fontSize:14,fontWeight:500,cursor:'pointer',background:insTab===i?'var(--acc)':'rgba(255,255,255,.08)',color:insTab===i?'#fff':'var(--fg-3)',transition:'all .18s'}},t))

          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',padding:'16px 0 6px',fontWeight:600,letterSpacing:'.06em'}},'基本資料'),

          fld('保險公司','insurer'),
          fld('保險類別','insType','text',INS_TYPES),

          fld('被保險人','insured'),

          fld('繳費頻率','premiumFreq','text',FREQ_OPTS),

          // 提醒按鈕
          !insEditMode && detailIns!=='new' && C('div',{onClick:addPremiumReminder,style:{marginTop:20,padding:'13px',background:'rgba(255,255,255,.06)',border:'.5px solid var(--border)',borderRadius:14,fontFamily:'var(--font-zh)',fontSize:14,fontWeight:500,color:'var(--fg)',textAlign:'center',cursor:'pointer'}},'🔔 加入保費提醒')
        ),
        // 保障內容 tab
        insTab===1 && detailIns!=='new' && C(React.Fragment,null,
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',padding:'16px 0 6px',fontWeight:600,letterSpacing:'.06em'}},'保障金額'),
          fld('死亡保額','deathCoverage','number'),
          fld('住院日額','hospitalDaily','number'),
          fld('手術限額','surgeryLimit','number'),
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',padding:'20px 0 6px',fontWeight:600,letterSpacing:'.06em'}},'保障摘要'),
          insEditMode
            ? C('textarea',{value:insForm.coverageNotes||'',onChange:e=>setInsForm({...insForm,coverageNotes:e.target.value}),rows:5,style:{...inp,resize:'none',lineHeight:1.6},placeholder:'詳細保障內容、條款備註...'})

        ),

        insTab===2 && detailIns!=='new' && C(React.Fragment,null,
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',padding:'16px 0 10px',fontWeight:600,letterSpacing:'.06em'}},'保單照片'),
          ins.photoData
            ? C('div',{style:{position:'relative'}},
                C('img',{src:ins.photoData,style:{width:'100%',borderRadius:14,border:'.5px solid var(--border)'}}),
                C('div',{onClick:()=>{const upd={...detailIns,photoData:''};saveAssets(assets.map(a=>a.id===detailIns.id?upd:a));setDetailIns(upd);},style:{marginTop:10,padding:'10px',background:'rgba(239,68,68,.15)',border:'.5px solid rgba(239,68,68,.3)',borderRadius:12,fontFamily:'var(--font-zh)',fontSize:13,color:'var(--exp)',textAlign:'center',cursor:'pointer'}},'刪除照片')
              )
            : C('div',{onClick:()=>photoRef.current&&photoRef.current.click(),style:{padding:'40px 0',border:'1.5px dashed rgba(255,255,255,.2)',borderRadius:16,display:'flex',flexDirection:'column',alignItems:'center',gap:10,cursor:'pointer'}},
                C('div',{style:{fontSize:36}},'📷'),
                C('div',{style:{fontFamily:'var(--font-zh)',fontSize:14,color:'var(--fg-3)'}},'點擊拍照或選取照片')
              ),
          C('input',{ref:photoRef,type:'file',accept:'image/*',style:{display:'none'},onChange:e=>{
            const f=e.target.files[0]; if(!f) return;
            const r=new FileReader();

              const img=new Image();
              img.onload=()=>{
                const cv=document.createElement('canvas');
                const MAX=1200; let w=img.width,h=img.height;
                if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
                cv.width=w;cv.height=h;

                const d=cv.toDataURL('image/jpeg',.75);
                const upd={...detailIns,photoData:d};
                saveAssets(assets.map(a=>a.id===detailIns.id?upd:a));
                setDetailIns(upd);
              };
              img.src=ev.target.result;
            };
            r.readAsDataURL(f);
            e.target.value='';
          }})

  // ── 主頁面（列表）── 比照其他 PF 頁面的設計系統（pf1-body 捲動容器、Large Title、置中膠囊新增鈕）

  const inputSt = {background:'rgba(255,255,255,.08)',border:'.5px solid rgba(255,255,255,.14)',borderRadius:10,color:'var(--fg)',padding:'10px 12px',fontFamily:'var(--font-zh)',fontSize:14,outline:'none',width:'100%',boxSizing:'border-box'};

  const dispInputSt = {background:'rgba(255,255,255,.08)',border:'.5px solid rgba(255,255,255,.14)',borderRadius:8,color:'var(--fg)',padding:'6px 10px',fontFamily:'var(--font-zh)',fontSize:13,outline:'none',width:130,textAlign:'right',boxSizing:'border-box'};

    C('div',{style:{position:'absolute',top:58,left:22,zIndex:70,width:200,background:'rgba(28,30,38,.92)',backdropFilter:'blur(28px)',WebkitBackdropFilter:'blur(28px)',border:'.5px solid rgba(255,255,255,.16)',borderRadius:18,padding:6,boxShadow:'0 18px 40px rgba(0,0,0,.55)',animation:'pf1-pop .22s cubic-bezier(.34,1.56,.64,1)',transformOrigin:'top center'}},

      ...ledgers.map((l,i)=>C('div',{key:l.id,onClick:()=>{window.pfSetLedger(i);setLedger(i);setLdgOpen(false);},style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:12,cursor:'pointer',background:i===ledger?'rgba(59,130,246,.18)':'transparent'}},
        C('span',{style:{fontSize:16}},l.icon),
        C('span',{style:{flex:1,fontFamily:'var(--font-zh)',fontSize:13,fontWeight:500,color:i===ledger?'var(--acc)':'var(--fg)'}},l.name),
        i===ledger&&C('span',{style:{color:'var(--acc)',fontSize:13}},'✓')
      ))

  return C('div',{className:'pf1-screen'},
    C('div',{className:'pf1-amb'}),

    C('div',{className:'pf1-body',style:{padding:'12px 0 165px'}},

      // ── 頂部標題（比照其他頁：28px / 800 / -.02em Large Title + 帳本 pill）
      C('div',{style:{padding:'12px 22px 14px'}},

        match: "224",
        prize: 200
      }
    }

  // 各期開獎日期（固定，不管有沒有號碼）
  const ANNOUNCE_DATES = {
    "1-2": "2026-03-25",
    "3-4": "2026-05-25",
    "5-6": "2026-07-25",
    "7-8": "2026-09-25",
    "9-10": "2026-11-25",
    "11-12": "2027-01-25"
  };
  const getPeriod = dateStr => {
    const m = new Date(dateStr).getMonth() + 1;
    if (m <= 2) return "1-2";
    if (m <= 4) return "3-4";
    if (m <= 6) return "5-6";
    if (m <= 8) return "7-8";
    if (m <= 10) return "9-10";
    return "11-12";
  };
  const checkLottery = (number, dateStr) => {
    const period = getPeriod(dateStr);
    const adStr = ANNOUNCE_DATES[period];
    if (!adStr) return {
      status: "pending"
    };
    const today = new Date();
    const ad = new Date(adStr);
    if (today < ad) {
      const mm = parseInt(adStr.slice(5, 7));
      const dd = parseInt(adStr.slice(8, 10));
      return {
        status: "pending",
        announceDate: mm + "/" + dd
      };
    }
    const pd = WINNING_PERIODS[period];
    if (!pd) return {
      status: "loss"
    };
    const d = number.replace(/\s/g, "").toUpperCase().replace(/[A-Z]/g, "");
    if (pd.特別獎.numbers.includes(d)) return {
      status: "won",
      prize: pd.特別獎.prize,
      label: "🏆 特別獎"
    };
    if (pd.特獎.numbers.includes(d)) return {
      status: "won",
      prize: pd.特獎.prize,
      label: "🥇 特獎"
    };
    if (pd.頭獎.numbers.some(w => d.endsWith(w))) return {
      status: "won",
      prize: pd.頭獎.prize,
      label: "🎖️ 頭獎"
    };
    for (const [k, v] of [["二獎", pd.二獎], ["三獎", pd.三獎], ["四獎", pd.四獎], ["五獎", pd.五獎], ["六獎", pd.六獎], ["增開六獎", pd.增開六獎]]) {
      if (v && v.match && d.endsWith(v.match)) return {
        status: "won",
        prize: v.prize,
        label: "🎊 " + k
      };
    }
    return {
      status: "loss"
    };
  };
  const keep4months = list => {
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - 4);

      return [];

      const s = JSON.parse(localStorage.getItem('pf_positions') || 'null');
      const arr = s && Array.isArray(s) ? s : [];
      return arr.filter(p => (p.ledger ?? 0) === ledger12);

<script>
// ── 共用帳戶清單（動態從 localStorage 讀取，PF1 更新後其他頁面也能拿到最新）
(function initAcctNames() {
  const fallback = ['台新銀行 活存', '中信銀行 薪轉', '玉山銀行 定存', '郵局存簿', 'CTBC 信用卡', '玉山 Ubear 卡'];
  try {
    const saved = JSON.parse(localStorage.getItem('pf_accounts') || 'null');
    window.ACCT_NAMES = saved && saved.length ? saved.map(a => a.name) : fallback;
  } catch {
    window.ACCT_NAMES = fallback;
  }
})();

// ── 共用分類（AddTxSheet 與 PF3 共用，可自行擴充）
// 儲存於 localStorage: pf_categories_exp / pf_categories_inc
window.getCategories = function (type) {
  const key = type === 'income' ? 'pf_categories_inc' : 'pf_categories_exp';
  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (saved && saved.length) return saved;
  } catch {}
  // 預設分類
  if (type === 'income') {
    return [{
      emoji: '💰',
      label: '薪資'
    }, {
      emoji: '📈',
      label: '投資'
    }, {
      emoji: '🎁',
      label: '獎金'
    }, {
      emoji: '💹',
      label: '利息'
    }, {
      emoji: '💸',
      label: '兼職'
    }, {
      emoji: '✨',
      label: '其他'
    }];
  }
  return [{
    emoji: '🍜',
    label: '吃喝'
  }, {
    emoji: '🚇',
    label: '交通'
  }, {
    emoji: '🛒',
    label: '購物'
  }, {
    emoji: '🏠',
    label: '帳單'
  }, {
    emoji: '🏥',
    label: '醫療'
  }, {
    emoji: '🎬',
    label: '娛樂'
  }, {
    emoji: '⛽',
    label: '加油'
  }, {
    emoji: '💳',
    label: '信用卡'
  }, {
    emoji: '🎁',
    label: '其他'
  }];
};

// ── 共用交易資料層（localStorage）
window.getTxList = function () {
  try {
    return JSON.parse(localStorage.getItem('pf_transactions') || '[]');
  } catch (e) {
    return [];
  }
};
window.saveTx = function (tx) {
  const list = window.getTxList();
  tx.id = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  tx.createdAt = new Date().toISOString();
  if (tx.ledgerId == null) tx.ledgerId = 'ldg-' + (window.__pfLedger || 0); // 標記目前帳本
  list.unshift(tx);
  try {
    localStorage.setItem('pf_transactions', JSON.stringify(list));
  } catch (e) {}
  window.dispatchEvent(new CustomEvent('pf-tx-added', {
    detail: tx
  }));
  return tx;
};

// ── 種子資料：pf_transactions（1–4 月各 20 筆，若 localStorage 為空自動填入）
// 【乾淨版】關閉所有種子範例資料，上線給測試者的 App 一開始是完全空白狀態
window.PF_SEED_DISABLED = true;

(function seedTransactions() {
  if (window.PF_SEED_DISABLED) return; // 乾淨版（上傳用）會設定這個旗標跳過種子資料
  try {
    const existing = JSON.parse(localStorage.getItem('pf_transactions') || '[]');
    if (existing.length > 0) return; // 已有資料，不覆蓋
    const T = (id, type, cat, catName, note, amount, date, time, acc) => ({
      id,
      type,
      cat,
      catName,
      note,
      amount,
      date,
      time,
      acc
    });

// ── 交易類型管理頁（全屏，Daak 風格）
function CatManagerSheet({open, onClose, initType}) {
  const C = React.createElement;
  const [activeType, setActiveType] = React.useState('expense');
  const [cats, setCats] = React.useState([]);
  const [editId, setEditId] = React.useState(null);
  const [editEmoji, setEditEmoji] = React.useState('');
  const [editLabel, setEditLabel] = React.useState('');
  const [showAdd, setShowAdd] = React.useState(false);
  const [newEmoji, setNewEmoji] = React.useState('');
  const [newLabel, setNewLabel] = React.useState('');
  const dragRef = React.useRef(null);
  const listRef = React.useRef(null);

  React.useEffect(() => {
    if (open) {
      const t = initType || 'expense';
      setActiveType(t); reload(t); setEditId(null); setShowAdd(false);
    }
  }, [open, initType]);

  const reload = t => {
    const raw = window.getCategories ? window.getCategories(t) : [];
    let idx = 0;
    setCats(raw.map(c => c.id ? c : Object.assign({}, c, {id: String(Date.now() + (idx++))})));
  };

  const save = (t, list) => {
    localStorage.setItem(t === 'income' ? 'pf_categories_inc' : 'pf_categories_exp', JSON.stringify(list));
    window.dispatchEvent(new Event('pf-cats-updated'));
  };

  const switchType = t => { setActiveType(t); reload(t); setEditId(null); setShowAdd(false); };

  const txCounts = React.useMemo(() => {
    try {
      const txs = JSON.parse(localStorage.getItem('pf_transactions') || '[]');
      return txs.reduce((m, tx) => { if (tx.cat) m[tx.cat] = (m[tx.cat] || 0) + 1; return m; }, {});
    } catch { return {}; }
  }, [open, activeType]);

  const delCat = id => { const nl = cats.filter(c => c.id !== id); setCats(nl); save(activeType, nl); };
  const startEdit = c => { setEditId(c.id); setEditEmoji(c.emoji); setEditLabel(c.label); };
  const commitEdit = () => {
    const nl = cats.map(c => c.id === editId ? Object.assign({}, c, {emoji: editEmoji, label: editLabel}) : c);
    setCats(nl); save(activeType, nl); setEditId(null);
  };
  const addCatNew = () => {
    if (!newEmoji || !newLabel.trim()) return;
    const nl = cats.concat([{id: String(Date.now()), emoji: newEmoji, label: newLabel.trim()}]);
    setCats(nl); save(activeType, nl); setNewEmoji(''); setNewLabel(''); setShowAdd(false);
  };
  const resetDefault = () => {
    localStorage.removeItem(activeType === 'income' ? 'pf_categories_inc' : 'pf_categories_exp');
    reload(activeType); window.dispatchEvent(new Event('pf-cats-updated'));
  };

  // Touch drag reorder
  const onListTouchMove = e => {
    if (!dragRef.current) return;
    const y = e.touches[0].clientY;
    const children = listRef.current ? Array.from(listRef.current.children) : [];
    let over = dragRef.current.idx;
    children.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      if (y >= r.top && y < r.bottom) over = i;
    });
    if (over !== dragRef.current.overIdx) { dragRef.current.overIdx = over; setCats(function(c){return c.slice();}); }
  };
  const onListTouchEnd = () => {
    if (!dragRef.current) return;
    const startIdx = dragRef.current.idx;
    const endIdx = dragRef.current.overIdx !== undefined ? dragRef.current.overIdx : startIdx;
    dragRef.current = null;
    if (endIdx !== startIdx) {
      const nl = cats.slice();
      const moved = nl.splice(startIdx, 1)[0];
      nl.splice(endIdx, 0, moved);
      setCats(nl); save(activeType, nl);
    }
  };

  if (!open) return null;

  const RB = '.5px solid rgba(255,255,255,.07)';
  const inpBase = {background:'rgba(255,255,255,.08)',border:'.5px solid rgba(255,255,255,.14)',color:'var(--fg)',outline:'none',fontFamily:'var(--font-zh)'};

  return C('div', {style:{position:'fixed',inset:0,zIndex:400,background:'var(--bg)',display:'flex',flexDirection:'column',animation:'pf1-slideup .25s ease'}},
    /* ── 頂欄 */
    C('div', {style:{display:'flex',alignItems:'center',gap:12,padding:'52px 20px 10px'}},
      C('div', {onClick:onClose, style:{width:36,height:36,borderRadius:18,background:'rgba(255,255,255,.1)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:18,color:'var(--fg)'}}, '←'),
      C('div', {style:{flex:1,fontFamily:'var(--font-zh)',fontSize:17,fontWeight:700,color:'var(--fg)'}}, '交易類型')
    ),
    /* ── 重置按鈕 */
    C('div', {style:{padding:'4px 16px 10px'}},
      C('div', {onClick:resetDefault, style:{textAlign:'center',padding:'11px 0',borderRadius:12,background:'var(--card)',border:'.5px solid var(--border)',fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,color:'var(--acc)',cursor:'pointer'}}, '重置為預設類型')
    ),
    /* ── 支出/收入 切換 */
    C('div', {style:{padding:'0 16px 14px',display:'flex',justifyContent:'center'}},
      C('div', {style:{display:'flex',background:'rgba(255,255,255,.08)',borderRadius:24,padding:3}},
        C('div', {onClick:function(){switchType('expense');}, style:{padding:'9px 32px',borderRadius:20,fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,cursor:'pointer',transition:'all .18s',background:activeType==='expense'?'rgba(59,130,246,.85)':'transparent',color:activeType==='expense'?'#fff':'var(--fg-3)'}}, '支出'),
        C('div', {onClick:function(){switchType('income');}, style:{padding:'9px 32px',borderRadius:20,fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,cursor:'pointer',transition:'all .18s',background:activeType==='income'?'rgba(52,216,130,.85)':'transparent',color:activeType==='income'?'#fff':'var(--fg-3)'}}, '收入')
      )
    ),
    C('div', {style:{height:'.5px',background:'var(--border)',margin:'0 16px'}}),
    /* ── 類別列表 */
    C('div', {ref:listRef, onTouchMove:onListTouchMove, onTouchEnd:onListTouchEnd, style:{flex:1,overflowY:'auto',padding:'0 16px 8px'}},
      cats.map(function(c, i) {
        const count = txCounts[c.emoji] || 0;
        const isDrag = dragRef.current && dragRef.current.idx === i;
        const isDrop = dragRef.current && dragRef.current.overIdx === i && dragRef.current.idx !== i;

        /* 編輯列 */
        if (editId === c.id) return C('div', {key:c.id, style:{display:'flex',alignItems:'center',gap:8,padding:'10px 0',borderBottom:RB}},
          C('input', {value:editEmoji, onChange:function(e){setEditEmoji(e.target.value);}, maxLength:2,
            style:Object.assign({},inpBase,{width:46,height:46,borderRadius:12,fontSize:22,textAlign:'center'})}),

                      C('span',{style:{fontFamily:'var(--font-en)',fontSize:13,color:'var(--fg-3)'}},fmtNT(amt)+' · '+pct+'%')

                    C('div',{style:{background:'rgba(255,255,255,.1)',borderRadius:999,height:5}},
                      C('div',{style:{height:'100%',borderRadius:999,width:pct+'%',
                        background:CAT_COLORS[i%CAT_COLORS.length],transition:'width .4s'}})
                    )

                })
              )
        )
      )

    // FAB — 記錄消費（＝帳務記帳）＋ 帳單輸入
    cur && C('div',{style:{position:'absolute',bottom:'calc(80px + 16px)',left:'50%',
      transform:'translateX(-50%)',zIndex:20,display:'flex',gap:8}},
      C('div',{onClick:function(){ setTxSheet({open:true, defaultAcc:cardLabel(cur)}); },
        style:{display:'inline-flex',alignItems:'center',gap:8,padding:'13px 20px',borderRadius:999,

        fontWeight:600,color:'var(--acc)',cursor:'pointer',boxShadow:'0 4px 20px rgba(0,0,0,.3)'}},

        C('div',{style:{fontFamily:'var(--font-zh)',fontSize:17,fontWeight:700,
          color:'var(--fg)',marginBottom:20}},editId?'編輯信用卡':'新增信用卡'),
        ['bank','name','last4','limit','billingDay','dueDay'].map(function(k){
          var labels = {bank:'發卡銀行',name:'卡片名稱',last4:'末4碼',limit:'信用額度',billingDay:'結帳日(日)',dueDay:'繳費截止(日)'};
          return C('div',{key:k,style:{marginBottom:12}},
            C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},labels[k]),
            C('input',{type:'text',value:cardForm[k],
              onChange:function(e){ CF(k, e.target.value); },
              placeholder:labels[k],style:inp})
          );
        }),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:6}},'卡片顏色'),
          C('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},

              return C('div',{key:col,onClick:function(){ CF('color',col); },style:{
                width:28,height:28,borderRadius:999,background:col,cursor:'pointer',
                border:col===cardForm.color?'2px solid #fff':'2px solid transparent'}});
            })
          )
        ),
        C('div',{onClick:saveCard,style:{padding:'14px',background:'var(--acc)',borderRadius:14,
          fontFamily:'var(--font-zh)',fontSize:15,fontWeight:600,color:'#fff',
          textAlign:'center',cursor:'pointer',marginTop:4}},'儲存')
      )
    ),

    // Modal: 新增帳單
    modal==='bill' && C('div',{key:'modal-bill',onClick:function(){ setModal('none'); },style:{
      position:'absolute',inset:0,background:'rgba(0,0,0,.5)',zIndex:100,
      display:'flex',alignItems:'flex-end'}},
      C('div',{onClick:function(e){ e.stopPropagation(); },style:{width:'100%',
        background:'var(--bg-2,#1a1c24)',border:'.5px solid var(--border)',
        borderRadius:'20px 20px 0 0',padding:'20px 20px 36px'}},
        C('div',{style:{fontFamily:'var(--font-zh)',fontSize:17,fontWeight:700,
          color:'var(--fg)',marginBottom:20}},editId?'編輯帳單':'新增月帳單'),
        editId ? null : C('div',{style:{marginBottom:16}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:11,color:'var(--fg-4)',marginBottom:8}},'快速輸入：拍照或上傳帳單，App 自動辨識金額並帶入'),
          C('div',{style:{display:'flex',gap:8}},
            C('label',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,
              padding:'14px 8px',borderRadius:12,background:'rgba(59,130,246,.12)',
              border:'.5px solid rgba(59,130,246,.3)',cursor:'pointer'}},
              C('span',{style:{fontSize:24}},'📷'),
              C('span',{style:{fontFamily:'var(--font-zh)',fontSize:12,fontWeight:600,color:'var(--acc)'}},'拍照／相片辨識'),
              C('input',{type:'file',accept:'image/*',style:{display:'none'},
                onChange:function(e){ if(e.target.files&&e.target.files.length) simulateScan('photo'); }})
            ),
            C('label',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,
              padding:'14px 8px',borderRadius:12,background:'rgba(255,208,96,.12)',
              border:'.5px solid rgba(255,208,96,.3)',cursor:'pointer'}},
              C('span',{style:{fontSize:24}},'📄'),
              C('span',{style:{fontFamily:'var(--font-zh)',fontSize:12,fontWeight:600,color:'var(--gld)'}},'上傳 PDF 帳單'),
              C('input',{type:'file',accept:'application/pdf',style:{display:'none'},
                onChange:function(e){ if(e.target.files&&e.target.files.length) simulateScan('pdf'); }})

          scanning ? C('div',{style:{marginTop:10,padding:'11px',borderRadius:10,
            background:'rgba(255,255,255,.06)',textAlign:'center',fontFamily:'var(--font-zh)',
            fontSize:13,color:'var(--fg-2)'}},(scanning==='photo'?'📷 辨識相片中…':'📄 解析 PDF 中…')+' 自動帶入金額') : null,
          C('div',{style:{borderTop:'.5px solid var(--border)',margin:'16px 0 4px'}})

        C('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},

            C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'年'),
            C('input',{type:'number',value:billForm.year,
              onChange:function(e){ BF('year',e.target.value); },style:inp})

          C('div',null,
            C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'月'),
            C('input',{type:'number',min:1,max:12,value:billForm.month,
              onChange:function(e){ BF('month',e.target.value); },style:inp})
          )
        ),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'帳單金額'),
          C('input',{type:'number',value:billForm.amount,
            onChange:function(e){ BF('amount',e.target.value); },placeholder:'NT$',style:inp})
        ),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'最低應繳'),
          C('input',{type:'number',value:billForm.minPayment,
            onChange:function(e){ BF('minPayment',e.target.value); },placeholder:'NT$',style:inp})

        C('div',{onClick:saveBill,style:{padding:'14px',background:'var(--acc)',borderRadius:14,
          fontFamily:'var(--font-zh)',fontSize:15,fontWeight:600,color:'#fff',
          textAlign:'center',cursor:'pointer',marginTop:4}},'儲存')
      )

    // Modal: 記錄消費
    modal==='tx' && C('div',{key:'modal-tx',onClick:function(){ setModal('none'); },style:{
      position:'absolute',inset:0,background:'rgba(0,0,0,.5)',zIndex:100,
      display:'flex',alignItems:'flex-end'}},
      C('div',{onClick:function(e){ e.stopPropagation(); },style:{width:'100%',
        background:'var(--bg-2,#1a1c24)',border:'.5px solid var(--border)',
        borderRadius:'20px 20px 0 0',padding:'20px 20px 36px'}},
        C('div',{style:{fontFamily:'var(--font-zh)',fontSize:17,fontWeight:700,
          color:'var(--fg)',marginBottom:20}},'記錄消費'),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'日期'),
          C('input',{type:'date',value:txForm.date,
            onChange:function(e){ TF('date',e.target.value); },style:inp})

        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'商家/說明'),
          C('input',{type:'text',value:txForm.desc,
            onChange:function(e){ TF('desc',e.target.value); },
            placeholder:'e.g. 全聯、Netflix',style:inp})
        ),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:6}},'類別'),
          C('div',{style:{display:'flex',flexWrap:'wrap',gap:6}},
            CATS.map(function(cat){
              return C('div',{key:cat,onClick:function(){ TF('category',cat); },style:{
                padding:'6px 12px',borderRadius:999,fontFamily:'var(--font-zh)',fontSize:13,
                cursor:'pointer',
                background:txForm.category===cat?'rgba(59,130,246,.25)':'rgba(255,255,255,.08)',
                border:txForm.category===cat?'.5px solid rgba(59,130,246,.5)':'.5px solid rgba(255,255,255,.1)',
                color:txForm.category===cat?'var(--acc)':'var(--fg)'}},cat);
            })
          )
        ),
        C('div',{style:{marginBottom:12}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginBottom:4}},'金額'),
          C('input',{type:'number',value:txForm.amount,
            onChange:function(e){ TF('amount',e.target.value); },placeholder:'NT$',style:inp})
        ),
        C('div',{onClick:saveTx,style:{padding:'14px',background:'var(--acc)',borderRadius:14,
          fontFamily:'var(--font-zh)',fontSize:15,fontWeight:600,color:'#fff',
          textAlign:'center',cursor:'pointer',marginTop:4}},'儲存')
      )
    )
    ,
    // Modal: 帳單明細（可編輯 / 刪除 / 標記已繳）
    billDetail && (function(){
      var b = billDetail; var card = cur || {};
      var rate = 0.15;
      var estInterest = Math.max(0, Math.round((b.amount - b.minPayment) * rate / 12));
      var cashback = Math.round(b.amount * 0.003);
      var prevBalance = Math.round(b.amount * 0.18);
      var newCharges = b.amount - prevBalance;
      var rows = [
        ['上期結轉', fmtNT(prevBalance), 'var(--fg-3)'],
        ['本期新增消費', fmtNT(newCharges), 'var(--fg)'],
        ['本期應繳總額', fmtNT(b.amount), 'var(--exp)'],
        ['最低應繳金額', fmtNT(b.minPayment), 'var(--fg)'],
        ['結帳日', '每月 '+(card.billingDay||'-')+' 日', 'var(--fg)'],
        ['繳款截止日', '每月 '+(card.dueDay||'-')+' 日', 'var(--gld)'],
        ['循環信用利率', (rate*100).toFixed(1)+'%', 'var(--fg)'],
        ['預估循環利息', '約 '+fmtNT(estInterest)+'（僅繳最低）', 'var(--fg-3)'],
        ['本期回饋', fmtNT(cashback), 'var(--inc)'],
        ['繳費狀態', b.paid?('已繳清 · '+b.paidDate):'未繳', b.paid?'var(--inc)':'var(--gld)']
      ];
      return C('div',{key:'modal-billdetail',onClick:function(){ setBillDetail(null); },style:{
        position:'absolute',inset:0,background:'rgba(0,0,0,.5)',zIndex:110,
        display:'flex',alignItems:'flex-end'}},
        C('div',{onClick:function(e){ e.stopPropagation(); },style:{width:'100%',
          background:'var(--bg-2,#1a1c24)',border:'.5px solid var(--border)',
          borderRadius:'20px 20px 0 0',padding:'20px 20px 36px',maxHeight:'85vh',overflowY:'auto'}},
          C('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
            C('div',{style:{width:10,height:10,borderRadius:3,background:card.color||'var(--acc)'}}),
            C('div',{style:{fontFamily:'var(--font-zh)',fontSize:17,fontWeight:700,color:'var(--fg)',flex:1}},
              (card.bank||'')+' '+(card.name||'')),
            C('div',{onClick:function(){ togglePaid(b.id); setBillDetail(null); },
              style:{display:b.paid?'none':'block',padding:'6px 12px',borderRadius:10,
              background:'rgba(52,216,130,.2)',color:'var(--inc)',fontFamily:'var(--font-zh)',
              fontSize:13,fontWeight:600,cursor:'pointer'}},'標記已繳')
          ),
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:13,color:'var(--fg-3)',marginBottom:16}},
            b.year+' 年 '+b.month+' 月帳單'),
          C('div',{style:{background:'var(--card)',border:'.5px solid var(--border)',borderRadius:16,
            padding:'4px 16px',marginBottom:16}},
            rows.map(function(r,ri){
              return C('div',{key:ri,style:{display:'flex',justifyContent:'space-between',
                alignItems:'center',padding:'11px 0',
                borderBottom:ri<rows.length-1?'.5px solid rgba(255,255,255,.06)':'none'}},
                C('span',{style:{fontFamily:'var(--font-zh)',fontSize:13,color:'var(--fg-3)'}},r[0]),
                C('span',{style:{fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,color:r[2]}},r[1])
              );
            })
          ),
          C('div',{style:{display:'flex',gap:10}},
            C('div',{onClick:function(){
              setBillForm({year:b.year,month:b.month,amount:String(b.amount),minPayment:String(b.minPayment)});
              setEditId(b.id); setBillDetail(null); setModal('bill');
            },style:{flex:1,textAlign:'center',padding:'13px',borderRadius:14,
              background:'rgba(255,255,255,.1)',fontFamily:'var(--font-zh)',fontSize:14,
              fontWeight:600,color:'var(--fg)',cursor:'pointer'}},'✎ 編輯'),
            C('div',{onClick:function(){
              saveBills(bills.filter(function(x){ return x.id!==b.id; })); setBillDetail(null);
            },style:{flex:1,textAlign:'center',padding:'13px',borderRadius:14,
              background:'rgba(255,95,87,.15)',border:'.5px solid rgba(255,95,87,.3)',
              fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,color:'var(--exp)',cursor:'pointer'}},'刪除')
          )
        )
      );
    })(),
    // Modal: 如何繳費（勾選已繳時彈出）
    payInfo && (function(){
      var b = payInfo; var card = cur || {};
      var methods = [
        ['🏦','約定帳戶自動扣繳','每月 '+(card.dueDay||'-')+' 日自動從約定帳戶扣款，免手續費'],
        ['💳','網銀／ATM 轉帳','轉入繳費帳號 9112-'+(card.last4||'****')+'-'+(card.billingDay||'00')],
        ['🏪','超商繳費','出示帳單條碼至四大超商繳納（單筆上限 2 萬）'],
        ['📱','行動支付','綁定 Line Pay／Apple Pay／錢包 App 繳卡費']
      ];
      return C('div',{key:'modal-pay',onClick:function(){ setPayInfo(null); },style:{
        position:'absolute',inset:0,background:'rgba(0,0,0,.55)',zIndex:120,
        display:'flex',alignItems:'flex-end'}},
        C('div',{onClick:function(e){ e.stopPropagation(); },style:{width:'100%',
          background:'var(--bg-2,#1a1c24)',border:'.5px solid var(--border)',
          borderRadius:'20px 20px 0 0',padding:'22px 20px 36px'}},
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:18,fontWeight:800,color:'var(--fg)',marginBottom:4}},'如何繳費？'),
          C('div',{style:{fontFamily:'var(--font-zh)',fontSize:13,color:'var(--fg-3)',marginBottom:16}},
            (card.bank||'')+' '+(card.name||'')+' · '+b.year+'/'+b.month+' 應繳 ',
            C('span',{style:{color:'var(--exp)',fontWeight:700}},fmtNT(b.amount))
          ),
          methods.map(function(m,mi){
            return C('div',{key:mi,style:{display:'flex',gap:12,padding:'13px 14px',marginBottom:8,
              background:'var(--card)',border:'.5px solid var(--border)',borderRadius:14}},
              C('span',{style:{fontSize:22,flexShrink:0}},m[0]),
              C('div',null,
                C('div',{style:{fontFamily:'var(--font-zh)',fontSize:14,fontWeight:600,color:'var(--fg)'}},m[1]),
                C('div',{style:{fontFamily:'var(--font-zh)',fontSize:12,color:'var(--fg-3)',marginTop:2,lineHeight:1.4}},m[2])
              )
            );
          }),
          C('div',{onClick:function(){ setPayInfo(null); },style:{marginTop:8,padding:'14px',
            borderRadius:14,background:'var(--acc)',textAlign:'center',fontFamily:'var(--font-zh)',
            fontSize:15,fontWeight:600,color:'#fff',cursor:'pointer'}},'完成')
        )
      );
    })()
    ,
    AddTxSheet && C(AddTxSheet,{open:txSheet.open,onClose:function(){ setTxSheet({open:false,defaultAcc:''}); },defaultAcc:txSheet.defaultAcc,defaultType:'expense',defaultAmount:null})
  ); // end return
}

window.PF13Final = PF13Final;
})();
</script>
